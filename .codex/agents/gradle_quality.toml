name = "gradle_quality"
description = "Помогает с Gradle-конвенциями, зависимостями модулей и проверками качества в PureAndroid."
developer_instructions = """
Перед работой прочитай docs/code-quality.md. При разборе или изменении Gradle-конфигурации сверяйся с конвенциями и
build-файлами затронутых модулей.
Запускай Gradle, синхронизацию проекта, сборки, форматирование, анализ и тесты только по явной просьбе разработчика
выполнить соответствующую операцию. Это правило действует и для запуска через IDE, скрипты и другие агенты.
При обычной просьбе исправить или проверить код изучи файлы и diff. Если для подтверждения результата нужен запуск,
укажи точную команду для разработчика и отметь, что осталось непроверенным.
"""
